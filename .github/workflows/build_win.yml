name: melonDS Windows

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  EXTERNAL_LIBS_Folder: external_libs
  DIRENT_COMMIT: 31db6474b5231c180bd4618c8c90e43af50c86d0
  ENET_COMMIT: 5a9c537fd464b3c6d3c55e1d3bd47588faf71b42
  FAAD2_COMMIT: 0fb09739d34a0deb59ee797758c5c02e81c3463c
  LIBARCHIVE_COMMIT: ba80276ccc3c941c4918ec6e2460059f0c525c43
  ZSTD_COMMIT: f8745da6ff1ad1e7bab384bd1f9d742439278e99
  MELONDS_GIT_BRANCH: ${{ github.ref }}
  MELONDS_GIT_HASH: ${{ github.sha }}
  MELONDS_BUILD_PROVIDER: GitHub Actions
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
   
jobs:
  build:
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v7
      
      - name: Install Visual Studio platform toolset v141
        run: |
          "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\setup.exe" modify --quiet --norestart --includeRecommended --installPath "C:\Program Files\Microsoft Visual Studio\18\Enterprise" --channelId VisualStudio.15.Release --add Microsoft.VisualStudio.Component.VC.v141.x86.x64

      - name: Create directory for dependencies
        run: mkdir ${{env.EXTERNAL_LIBS_Folder}}
        
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: 14.1
      - name: Install faad2
        run: |
          git clone --revision ${{env.FAAD2_COMMIT}} https://github.com/FreewareAdvancedAudio/faad2
          cd faad2
          mkdir build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_GENERATOR_TOOLSET=v141 -D_WIN32_WINNT=0x0601 -DWINVER=0x0601 ^
          -DCMAKE_INSTALL_PREFIX=${{github.workspace}}\${{env.EXTERNAL_LIBS_Folder}} ^
          -DBUILD_SHARED_LIBS=OFF
          cmake --build build --config Release
          cmake --install build
          
      - name: Clean up faad2 installation
        run: rmdir /q /s ${{ github.workspace }}\faad2

      - name: Install enet
        run: |
          git clone --revision ${{env.ENET_COMMIT}} https://github.com/lsalzman/enet
          cd enet
          mkdir build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_GENERATOR_TOOLSET=v141 -D_WIN32_WINNT=0x0601 -DWINVER=0x0601 ^
          -DCMAKE_INSTALL_PREFIX=${{github.workspace}}\${{env.EXTERNAL_LIBS_Folder}} ^
          -DBUILD_SHARED_LIBS=OFF
          cmake --build build --config Release
          cmake --install build
          
      - name: Clean up enet installation
        run: rmdir /q /s ${{ github.workspace }}\enet

      - name: Install zstd
        run: |
          git clone --revision ${{env.ZSTD_COMMIT}} https://github.com/facebook/zstd
          cd zstd
          cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -D_WIN32_WINNT=0x0601 -DWINVER=0x0601 ^
          -DCMAKE_INSTALL_PREFIX=${{github.workspace}}\${{env.EXTERNAL_LIBS_Folder}} ^
          -DZSTD_LEGACY_SUPPORT=OFF -DZSTD_MULTITHREAD_SUPPORT=ON -DZSTD_BUILD_PROGRAMS=OFF -DZSTD_BUILD_CONTRIB=OFF -DZSTD_BUILD_TESTS=OFF ^
          -DZSTD_USE_STATIC_RUNTIME=OFF -DZSTD_PROGRAMS_LINK_SHARED=OFF -DZSTD_BUILD_STATIC=ON -DZSTD_BUILD_SHARED=OFF -DBUILD_SHARED_LIBS=OFF ${{ github.workspace }}\zstd\build\cmake
          ninja
          copy /v /y ${{ github.workspace }}\zstd\lib\zstd_static.lib ${{github.workspace}}\${{env.EXTERNAL_LIBS_Folder}}\lib
          copy /v /y ${{ github.workspace }}\zstd\lib\*.h ${{github.workspace}}\${{env.EXTERNAL_LIBS_Folder}}\include

      - name: Clean up zstd installation
        run: rmdir /q /s ${{ github.workspace }}\zstd

      - name: Install dirent
        run: |
          git clone --revision ${{env.DIRENT_COMMIT}} https://github.com/tronkko/dirent
          copy /v /y ${{ github.workspace }}\dirent\include\*.h ${{github.workspace}}\${{env.EXTERNAL_LIBS_Folder}}\include

      - name: Clean up dirent installation
        run: rmdir /q /s ${{ github.workspace }}\dirent

      - name: Install libarchive
        run: |
          git clone --revision ${{env.LIBARCHIVE_COMMIT}} https://github.com/libarchive/libarchive
          cd libarchive
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_GENERATOR_TOOLSET=v141 -DWINDOWS_VERSION=WIN7 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ^
          -DCMAKE_INSTALL_PREFIX=${{github.workspace}}\${{env.EXTERNAL_LIBS_Folder}} ^
          -DENABLE_OPENSSL=OFF -DENABLE_ZSTD=OFF -DENABLE_TEST=OFF ^
          -DBUILD_SHARED_LIBS=OFF
          cmake --build build --config Release
          cmake --install build

      - name: Clean up libarchive installation
        run: rmdir /q /s ${{ github.workspace }}\libarchive
