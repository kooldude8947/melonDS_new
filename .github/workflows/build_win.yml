name: melonDS Windows

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  EXTERNAL_LIBS_Folder: external_libs
  ENET_COMMIT: 5a9c537fd464b3c6d3c55e1d3bd47588faf71b42
  FAAD2_COMMIT: 0fb09739d34a0deb59ee797758c5c02e81c3463c
  ZSTD_COMMIT: 49cf51799ea051457f57243527aa2058f999f005
  MELONDS_GIT_BRANCH: ${{ github.ref }}
  MELONDS_GIT_HASH: ${{ github.sha }}
  MELONDS_BUILD_PROVIDER: GitHub Actions
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
   
jobs:
  build:
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v7
      
      - name: List C
        run: echo "Listing C..." && dir "C:\"

      - name: List Program Files
        run: echo "Listing Program Files..." && dir "C:\Program Files"

      - name: List Program Files (x86)
        run: echo "Listing Program Files (x86)..." && dir "C:\Program Files (x86)"

      - name: List Tools
        run: echo "Listing tools..." && dir "C:\tools"
